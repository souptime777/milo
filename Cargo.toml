[package]
name = "milo"
version = "0.1.0"
edition = "2024"

[lib]
name = "milo_core"
path = "src/lib.rs"

[features]
default = ["pext"]
pext = []

[[bin]]
name = "milo"
path = "src/main.rs"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "perft"
harness = false

[dependencies]
arrayvec = "0.7.8"
